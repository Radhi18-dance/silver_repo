<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SILVER Pumps & Motors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background-color: #34495e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            width: 350px;
            animation: fadeInUp 1s ease-in-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container img {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .form-label {
            color: #ecf0f1;
            font-weight: 500;
        }

        .form-control {
            background-color: #2c3e50;
            border: none;
            border-radius: 4px;
            color: #ecf0f1;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
            background-color: #2c3e50;
            color: #ecf0f1;
        }

        .btn-login {
            background-color: #5d6d7e;
            color: #ecf0f1;
            transition: background-color 0.3s ease;
        }

        .btn-login:hover {
            background-color: #2e86de;
            color: #fff;
        }

        .forgot-link {
            color: #95a5a6;
            display: block;
            margin-top: 10px;
            font-size: 0.85rem;
            text-align: center;
        }

        .forgot-link:hover {
            text-decoration: underline;
            color: #bdc3c7;
        }
    </style>
</head>

<body>
    {% if msg or errors %}
    <div class="alert-box animate__animated animate__fadeInDown">
        <div class="alert {% if errors %}alert-danger{% else %}alert-info{% endif %} alert-dismissible fade show"
            role="alert">
            <strong>{{ msg }}</strong>
            {% if errors %}
            <p>{{ errors }}</p>
            {% endif %}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    {% endif %}
    <div class="login-container text-center">
        <img src="/static/adminlogo.jpg" alt="Silver Pumps & Motors Logo" />
        <form method="post">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required />
            </div>
            <div class="mb-3 text-start">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" class="form-control" id="password" required />
            </div>
            <button type="submit" class="btn btn-login w-100">Sign in</button>
            <a href="/forgotpass" class="forgot-link">Can't access your account?</a>
        </form>
    </div>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (username && password) {
                alert(`Logging in as: ${username}`);
                // Here, you'd send credentials to your backend via AJAX or similar
            } else {
                alert("Please enter both username and password.");
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
